services:
  migrations:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: alembic upgrade head
    environment:
      DATABASE_URL: ${DATABASE_URL}
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      FAL_KEY: ${FAL_KEY}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      IMAGE_MODEL: ${IMAGE_MODEL:-fal-ai/nano-banana-pro}
      VIDEO_MODEL: ${VIDEO_MODEL:-fal-ai/veo3.1/image-to-video}
      MUSIC_MODEL: ${MUSIC_MODEL:-fal-ai/lyria2}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - media_data:/app/data
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  media_data:
