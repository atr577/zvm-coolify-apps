services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reggy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-reggy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reggy"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrations:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python init_db.py
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-reggy}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-reggy}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-reggy}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-reggy}
      SECRET_KEY: ${SECRET_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      FAL_KEY: ${FAL_KEY}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      IMAGE_MODEL: ${IMAGE_MODEL:-fal-ai/nano-banana-pro}
      VIDEO_MODEL: ${VIDEO_MODEL:-fal-ai/veo3.1/image-to-video}
      MUSIC_MODEL: ${MUSIC_MODEL:-fal-ai/lyria2}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - media_data:/app/data
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
